# .dogfood.toml, read by the DOGFOOD acceptance checker:  python3 run.py .dogfood.toml
# Every route below is the API, served by `docker compose up` on port 4000.

[portal]
base_url = "http://localhost:4000"

[tiers]
# The checker verifies T1 and T2 only; T3 and T4 are claimed on the features and tests
# described in README.md and walked through in docs/MANUAL-TESTING.md.
claimed = ["T1", "T2", "T3", "T4"]
pitch = "A self-hostable, API-first hackathon platform with event-scoped roles, weighted rubrics, documented cross-judge normalization and judge isolation enforced in the backend."

[auth]
# API tokens issued by the seed, scoped to the fixture event: inside sample-hack-2026 they act as
# the account, anywhere else as nobody. Public by design; FIXTURE_TOKENS=false skips them.
# organizer = organizer@example.org, judge_a = marek.nowak (jdg_08), judge_b = mira.kaur (jdg_19),
# participant = priya1@example.org (team NorthKiln).
organizer   = "Authorization: Bearer pod_dogfood_organizer_mHUdlL3Z74StgxfAF-ULvUiv"
judge_a     = "Authorization: Bearer pod_dogfood_judgea_tYGVQuQmtrBYbXhQx9E0vKFU"
judge_b     = "Authorization: Bearer pod_dogfood_judgeb_glvLi55oj-xnR4F4kEmvatkc"
participant = "Authorization: Bearer pod_dogfood_participant_3DXe91anyGasgaMGSdAfCBam"

[routes]
# The fixture event is imported from fixtures.json as "sample-hack-2026".
gallery      = "/api/events/sample-hack-2026/submissions?take=100"
submit       = "/api/events/sample-hack-2026/submissions"
judge_scores = "/api/events/sample-hack-2026/judges/me/scores"
# judge_a's scores, by account id. Judge B is refused with 403 and the attempt is audited.
peer_scores  = "/api/events/sample-hack-2026/judges/226f5e65-2d5c-431b-9366-cb8492f2f6ab/scores"
csv_export   = "/api/events/sample-hack-2026/export/scores.csv"

[project]
license = "MIT"
repository = "https://github.com/ikeshavvarshney/podium"
web = "http://localhost:3000"
seed_password = "podium-demo-2026"
bonus = "normalization-proof"   # docs/normalization-proof.md; also present: docs/openapi.json, docs/SECURITY.md threat model
